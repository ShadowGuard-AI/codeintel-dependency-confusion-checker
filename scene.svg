<g fill="#eef3f1"><ellipse cx="580" cy="262" rx="10" ry="3"><animate attributeName="cx" values="580;566;580" dur="13s" repeatCount="indefinite"/></ellipse><ellipse cx="628" cy="276" rx="8" ry="3"><animate attributeName="cx" values="628;616;628" dur="13s" repeatCount="indefinite"/></ellipse></g>
